name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: implementation/hal-core/package-lock.json

      - name: Install
        working-directory: implementation/hal-core
        run: npm ci

      - name: Format check
        working-directory: implementation/hal-core
        run: npm run format:check

      - name: Lint
        working-directory: implementation/hal-core
        run: npm run lint

      - name: Typecheck
        working-directory: implementation/hal-core
        run: npm run typecheck

      - name: Test
        working-directory: implementation/hal-core
        run: npm run test

      - name: Security scan
        working-directory: implementation/hal-core
        run: npm run security:scan
